{% extends 'base.html' %}
{% block title %}Password Reset Complete - BharatVerse{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-festive p-8 border-2 border-orange-100 text-center">
        <div class="w-16 h-16 mx-auto rounded-3xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mb-4">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2 class="text-2xl font-display font-extrabold text-slate-800 mb-2">Password Reset Complete</h2>
        <p class="text-xs text-slate-600 leading-relaxed mb-6">
            Your new password has been set. You may now go ahead and log in.
        </p>
        <a href="{% url 'login' %}" class="inline-block bg-gradient-to-r from-orange-500 to-amber-500 hover:opacity-95 text-white font-display font-bold px-8 py-3 rounded-xl text-xs uppercase tracking-wider shadow-festive transition">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
