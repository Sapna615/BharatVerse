{% extends 'base.html' %}
{% block title %}Reset Password - BharatVerse{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-festive p-8 border-2 border-orange-100">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl mb-3">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-3xl font-display font-extrabold text-slate-800">Forgot Password?</h2>
            <p class="mt-2 text-xs text-slate-500 leading-relaxed">
                Enter your registered email address and we'll send you instructions to reset your password.
            </p>
        </div>

        <form class="space-y-6" method="POST" action="{% url 'password_reset' %}">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Registered Email Address</label>
                <input id="id_email" name="email" type="email" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition" 
                    placeholder="name@example.com">
            </div>

            <div>
                <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 rounded-xl text-sm font-display font-bold text-white bg-gradient-to-r from-orange-500 via-rose-500 to-amber-500 hover:opacity-95 shadow-festive transition-all uppercase tracking-wider">
                    Send Password Reset Link
                </button>
            </div>

            <div class="text-xs text-center text-slate-500 pt-2">
                Remember your password? 
                <a href="{% url 'login' %}" class="font-bold text-orange-600 hover:text-orange-700 ml-1">Back to Sign in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
