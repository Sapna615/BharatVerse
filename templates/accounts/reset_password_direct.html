{% extends 'base.html' %}
{% block title %}Reset Password - BharatVerse{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-festive p-8 border-2 border-orange-100">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl mb-3">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-3xl font-display font-extrabold text-slate-800">Reset Password</h2>
            <p class="mt-2 text-xs text-slate-500 leading-relaxed">
                Enter your username or email and choose your new password.
            </p>
        </div>

        <form class="space-y-5" method="POST" action="{% url 'direct_reset_password' %}">
            {% csrf_token %}
            <div>
                <label for="identifier" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Username or Email</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-xs text-slate-400"></i>
                    <input id="identifier" name="identifier" type="text" required 
                        class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition" 
                        placeholder="Enter your username or email">
                </div>
            </div>

            <div>
                <label for="new_password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Enter New Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-xs text-slate-400"></i>
                    <input id="new_password" name="new_password" type="password" required minlength="6"
                        class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition" 
                        placeholder="Minimum 6 characters">
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Confirm New Password</label>
                <div class="relative">
                    <i class="fa-solid fa-shield-check absolute left-3.5 top-3.5 text-xs text-slate-400"></i>
                    <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
                        class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition" 
                        placeholder="Re-enter your new password">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 rounded-xl text-sm font-display font-bold text-white bg-gradient-to-r from-orange-500 via-rose-500 to-amber-500 hover:opacity-95 shadow-festive transition-all uppercase tracking-wider">
                    Update Password &amp; Sign In
                </button>
            </div>

            <div class="text-xs text-center text-slate-500 pt-2">
                Remember your password? 
                <a href="{% url 'login' %}" class="font-bold text-orange-600 hover:text-orange-700 ml-1">Back to Sign in</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
