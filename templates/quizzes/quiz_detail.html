{% extends 'base.html' %}
{% block title %}{{ quiz.title }} - BharatVerse{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-16 text-center">
    <h1 class="text-4xl font-serif font-bold text-bharat-navy mb-6">{{ quiz.title }}</h1>
    <p class="text-xl text-gray-600 mb-8">{{ quiz.description }}</p>
    
    <div class="bg-gray-50 rounded-2xl p-12 border border-gray-200">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Ready to start?</h2>
        <p class="text-gray-500 mb-8">Test your knowledge and earn XP!</p>
        <div class="flex justify-center gap-4">
            <a href="{% url 'games_hub' %}" class="bg-transparent border-2 border-bharat-navy text-bharat-navy hover:bg-bharat-navy hover:text-white px-6 py-3 rounded-xl font-bold shadow transition">Back to Games Hub</a>
            <a href="{% url 'take_quiz' quiz.slug %}" class="bg-bharat-saffron text-white px-6 py-3 rounded-xl font-bold shadow hover:bg-orange-600 transition">Start Quiz</a>
        </div>
    </div>
</div>
{% endblock %}
